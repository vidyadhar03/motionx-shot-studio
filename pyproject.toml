[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionx-shot-studio"
version = "0.1.0"
description = "Project-based shot making on ComfyUI: frame + direction -> approved generation -> takes with provenance."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pillow>=10",
  "httpx>=0.27",
  "comfy-sdk>=0.5,<0.6",
  "comfy-api-proxy>=0.1.6,<0.2",
  "google-genai>=2.31,<3",      # agent: Gemini (default live provider), Interactions API
  "anthropic>=1.15,<2",         # agent: Anthropic (alternative live provider)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
